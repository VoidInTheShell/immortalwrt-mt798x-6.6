<svg xmlns="http://www.w3.org/2000/svg" id="soc-modules" width="1180" height="995" viewBox="0 0 1180 995" role="img" aria-labelledby="soc-modules-title soc-modules-desc"><title id="soc-modules-title">模块级架构 · SoC 内外边界与通信关系</title><desc id="soc-modules-desc">功能拓扑，不代表芯片 floorplan；蓝色＝数据，灰虚线＝控制，紫色＝共享内存访问。</desc><defs><marker id="soc-modules-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#21789f"/></marker><marker id="soc-modules-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#237e70"/></marker><marker id="soc-modules-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#aa6729"/></marker><marker id="soc-modules-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#748696"/></marker><marker id="soc-modules-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7760a5"/></marker></defs><style>#soc-modules text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}#soc-modules path{stroke-linejoin:round}</style><rect width="1180" height="995" fill="white"/><text x="18" y="34" font-size="28" fill="#183c51" font-weight="700" text-anchor="start">模块级架构 · SoC 内外边界与通信关系</text><text x="18" y="67" font-size="18" fill="#547084" font-weight="400" text-anchor="start">功能拓扑，不代表芯片 floorplan；蓝色＝数据，灰虚线＝控制，紫色＝共享内存访问。</text><path d="M765 267H810" fill="none" stroke="#237e70" stroke-width="2.6"  marker-start="url(#soc-modules-green)" marker-end="url(#soc-modules-green)"/><path d="M210 311V405" fill="none" stroke="#7760a5" stroke-width="2.6"  marker-start="url(#soc-modules-purple)" marker-end="url(#soc-modules-purple)"/><path d="M595 311V405" fill="none" stroke="#7760a5" stroke-width="2.6"  marker-start="url(#soc-modules-purple)" marker-end="url(#soc-modules-purple)"/><path d="M975 311V405" fill="none" stroke="#7760a5" stroke-width="2.6"  marker-start="url(#soc-modules-purple)" marker-end="url(#soc-modules-purple)"/><path d="M210 501V568" fill="none" stroke="#7760a5" stroke-width="2.6"  marker-start="url(#soc-modules-purple)" marker-end="url(#soc-modules-purple)"/><path d="M595 501V568" fill="none" stroke="#7760a5" stroke-width="2.6"  marker-start="url(#soc-modules-purple)" marker-end="url(#soc-modules-purple)"/><path d="M975 501V568" fill="none" stroke="#748696" stroke-width="2.6" stroke-dasharray="7 5" marker-start="url(#soc-modules-gray)" marker-end="url(#soc-modules-gray)"/><path d="M210 744V842" fill="none" stroke="#21789f" stroke-width="2.6"  marker-start="url(#soc-modules-blue)" marker-end="url(#soc-modules-blue)"/><path d="M790 501V816H595V842" fill="none" stroke="#7760a5" stroke-width="2.6"  marker-start="url(#soc-modules-purple)" marker-end="url(#soc-modules-purple)"/><path d="M595 145V132H1155V236" fill="none" stroke="#237e70" stroke-width="2.6"/><path d="M1140 236H1155V817H975V842" fill="none" stroke="#237e70" stroke-width="2.6"  marker-start="url(#soc-modules-green)" marker-end="url(#soc-modules-green)"/><rect x="15" y="90" width="1150" height="700" rx="16" fill="#21789f05" stroke="#21789f" stroke-width="2" stroke-dasharray="9 5"/><rect x="27" y="97" width="584.5600000000002" height="29" rx="4" fill="white"/><text x="33" y="119" font-size="23" fill="#21789f" font-weight="700" text-anchor="start">MT7986A / Filogic 830 · 四个主要片内功能域</text><g data-box="MCUSYS · CPU 集群"><rect x="40" y="145" width="340" height="166" rx="12" fill="#21789f0b" stroke="#21789f" stroke-width="1.8"/><text x="55" y="176" font-size="22" fill="#21789f" font-weight="700" text-anchor="start">MCUSYS · CPU 集群</text><text x="55" y="206" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">4× Cortex-A53 / 最高 2GHz</text><text x="55" y="233" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">每核 L1I 32KiB + L1D 32KiB</text><text x="55" y="260" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">SCU + 共享 L2 512KiB</text><text x="55" y="287" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">GICv3 / Timer / Debug</text></g><g data-box="NETSYS v2 · 网络加速域"><rect x="425" y="145" width="340" height="166" rx="12" fill="#237e700b" stroke="#237e70" stroke-width="1.8"/><text x="440" y="176" font-size="22" fill="#237e70" font-weight="700" text-anchor="start">NETSYS v2 · 网络加速域</text><text x="440" y="206" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">PSE 包交换 + PPE0 / PPE1</text><text x="440" y="233" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">PDMA / QDMA / WDMA0/1</text><text x="440" y="260" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">GMAC0/1 → 两路 2.5G PHY</text><text x="440" y="287" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">WED v2 ×2 + WO0 / WO1</text></g><g data-box="CONNSYS · 无线数字域"><rect x="810" y="145" width="330" height="166" rx="12" fill="#237e700b" stroke="#237e70" stroke-width="1.8"/><text x="825" y="176" font-size="22" fill="#237e70" font-weight="700" text-anchor="start">CONNSYS · 无线数字域</text><text x="825" y="206" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">WM / WA 固件与控制逻辑</text><text x="825" y="233" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">WFDMA + UMAC PSE / PLE</text><text x="825" y="260" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">Wi-Fi MAC / 基带 / 安全处理</text><text x="825" y="287" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">RF 接口 → 外部 MT7976C</text></g><rect x="716.1" y="316" width="141.79999999999998" height="23" rx="4" fill="white"/><text x="787" y="333" font-size="17" fill="#237e70" font-weight="400" text-anchor="middle">WED ↔ WFDMA</text><g data-box="片内系统互连 / EMI / DRAMC"><rect x="40" y="405" width="1100" height="96" rx="12" fill="#7760a50b" stroke="#7760a5" stroke-width="1.8"/><text x="55" y="436" font-size="22" fill="#7760a5" font-weight="700" text-anchor="start">片内系统互连 / EMI / DRAMC</text><text x="55" y="466" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">CPU 与 DMA master 共享 DDR；高速事务走片内总线，低速寄存器经总线桥 / APB 等访问。</text></g><rect x="119.92000000000002" y="347" width="180.15999999999997" height="24" rx="4" fill="white"/><text x="210" y="365" font-size="18" fill="#7760a5" font-weight="400" text-anchor="middle">集群 master 接口</text><rect x="490.15999999999997" y="347" width="209.68000000000004" height="24" rx="4" fill="white"/><text x="595" y="365" font-size="18" fill="#7760a5" font-weight="400" text-anchor="middle">报文 / 描述符 / FOE</text><rect x="869.44" y="347" width="211.12" height="24" rx="4" fill="white"/><text x="975" y="365" font-size="18" fill="#7760a5" font-weight="400" text-anchor="middle">报文 / 固件 / 描述符</text><g data-box="通用 I/O 与存储域"><rect x="40" y="568" width="340" height="176" rx="12" fill="#21789f0b" stroke="#21789f" stroke-width="1.8"/><text x="55" y="599" font-size="22" fill="#21789f" font-weight="700" text-anchor="start">通用 I/O 与存储域</text><text x="55" y="629" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">PCIe 2.0 RC ×2 lanes</text><text x="55" y="656" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">USB3 / USB2 Host + DMA</text><text x="55" y="683" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">MSDC / SPI-NAND / I²C</text><text x="55" y="710" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">UART / PWM / GPIO / Audio</text></g><g data-box="系统服务与独立加速"><rect x="425" y="568" width="340" height="176" rx="12" fill="#21789f0b" stroke="#21789f" stroke-width="1.8"/><text x="440" y="599" font-size="22" fill="#21789f" font-weight="700" text-anchor="start">系统服务与独立加速</text><text x="440" y="629" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">EIP97 加密引擎 + DMA</text><text x="440" y="656" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">CQ_DMA / AP_DMA</text><text x="440" y="683" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">Boot ROM / SYSRAM</text><text x="440" y="710" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">Clock / Reset / WDT / Thermal</text></g><g data-box="控制与中断关系"><rect x="810" y="568" width="330" height="176" rx="12" fill="#7486960b" stroke="#748696" stroke-width="1.8"/><text x="825" y="599" font-size="22" fill="#748696" font-weight="700" text-anchor="start">控制与中断关系</text><text x="825" y="629" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">CPU → MMIO 配置所有子域</text><text x="825" y="656" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">IRQ → GIC → A53</text><text x="825" y="683" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">AP ↔ WO：CCIF 消息</text><text x="825" y="710" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">AP ↔ Wi-Fi：命令 / 事件环</text></g><g data-box="板外 / 板载扩展终点"><rect x="40" y="842" width="340" height="116" rx="12" fill="#21789f0b" stroke="#21789f" stroke-width="1.8"/><text x="55" y="873" font-size="22" fill="#21789f" font-weight="700" text-anchor="start">板外 / 板载扩展终点</text><text x="55" y="903" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">NVMe / 蜂窝 USB / eMMC</text><text x="55" y="930" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">NAND / EEPROM / 调试口</text></g><g data-box="板载 2GB DDR4"><rect x="425" y="842" width="340" height="116" rx="12" fill="#7760a50b" stroke="#7760a5" stroke-width="1.8"/><text x="440" y="873" font-size="22" fill="#7760a5" font-weight="700" text-anchor="start">板载 2GB DDR4</text><text x="440" y="903" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">SoC 控制器 16-bit</text><text x="440" y="930" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">DDR4-3200 平台上限</text></g><g data-box="板载网络模拟 / 物理层"><rect x="810" y="842" width="330" height="116" rx="12" fill="#237e700b" stroke="#237e70" stroke-width="1.8"/><text x="825" y="873" font-size="22" fill="#237e70" font-weight="700" text-anchor="start">板载网络模拟 / 物理层</text><text x="825" y="903" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">EN8811H ×2 → RJ45 ×2</text><text x="825" y="930" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">MT7976C → 2G/5G 天线</text></g><text x="18" y="987" font-size="18" fill="#183c51" font-weight="400" text-anchor="start">NETSYS、CONNSYS、I/O 均在 SoC 内，但不在 Cortex-A53 核心内；内部链路不能直接套用外部端口的 Gb/s。</text></svg>