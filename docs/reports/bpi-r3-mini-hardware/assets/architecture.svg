<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1030" viewBox="0 0 1200 1030" role="img" aria-labelledby="arch-title arch-desc">
<title id="arch-title">BPI-R3 Mini 功能级硬件连接总图</title>
<desc id="arch-desc">MT7986A 连接 DDR4、eMMC、SPI-NAND、USB-A、EEPROM、MT7976C、两颗 EN8811H、PCIe NVMe 及 USB 蜂窝模块，底部展示调试、控制和供电分组。</desc>
<defs>
  <marker id="arch-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2279a5"/></marker>
  <marker id="arch-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
  <marker id="arch-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#be6d1b"/></marker>
</defs>
<style>
  text{font-family:"Microsoft YaHei","Noto Sans CJK SC","PingFang SC",sans-serif;fill:#142e43} .box{fill:#f2f7fb;stroke:#92b3c8;stroke-width:1.7} .network{fill:#edf8f6;stroke:#6aada0} .optional{stroke-dasharray:7 5} .title{font-size:23px;font-weight:700} .body{font-size:18px} .small{font-size:16px;fill:#476276} .link{fill:none;stroke:#2279a5;stroke-width:2.5;marker-start:url(#arch-blue);marker-end:url(#arch-blue)} .ctl{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arch-gray)} .power{fill:none;stroke:#be6d1b;stroke-width:2.5;marker-end:url(#arch-orange)}
</style>
<rect width="1200" height="1030" rx="16" fill="#fff"/>
<text x="20" y="36" class="title">BPI-R3 MINI · FUNCTIONAL ARCHITECTURE</text>
<text x="20" y="66" class="small">板级依据：公开 V1.0 原理图 + Banana Pi 规格 + OpenWrt 上游定义</text>

<rect x="460" y="110" width="280" height="680" rx="20" fill="#123d56"/>
<g fill="#fff" text-anchor="middle">
<text x="600" y="215" style="fill:#fff;font-size:29px;font-weight:700">MT7986A</text>
<text x="600" y="250" style="fill:#b6d8e9;font-size:21px">MediaTek Filogic 830</text>
<text x="600" y="301" style="fill:#fff;font-size:23px">4× Cortex-A53</text>
<text x="600" y="335" style="fill:#fff;font-size:22px">最高 2GHz · 12nm</text>
<path d="M490 372H710" stroke="#47718a"/>
<text x="600" y="417" style="fill:#d9eaf3;font-size:21px">CPU / 内存控制器</text>
<text x="600" y="455" style="fill:#d9eaf3;font-size:21px">Ethernet MAC ×2</text>
<text x="600" y="493" style="fill:#d9eaf3;font-size:21px">Wi-Fi / RF 接口</text>
<text x="600" y="531" style="fill:#d9eaf3;font-size:21px">PCIe / USB Host</text>
<text x="600" y="569" style="fill:#d9eaf3;font-size:21px">eMMC / SPI</text>
<text x="600" y="607" style="fill:#d9eaf3;font-size:21px">UART / I²C / PWM</text>
<text x="600" y="645" style="fill:#d9eaf3;font-size:21px">GPIO / Watchdog</text>
<text x="600" y="727" style="fill:#b6d8e9;font-size:17px">片内功能按用途聚合展示</text>
</g>

<g>
<rect class="box" x="20" y="110" width="260" height="112" rx="12"/><text class="title" x="38" y="144">2GB DDR4</text><text class="body" x="38" y="174">SoC 控制器 16-bit</text><text class="small" x="38" y="202">实际训练频率待确认</text>
<rect class="box" x="20" y="250" width="260" height="112" rx="12"/><text class="title" x="38" y="284">8GB eMMC · U2</text><text class="body" x="38" y="314">THGBMJG6C1LBAIL</text><text class="small" x="38" y="342">VCC 3.3V / VCCQ 1.8V</text>
<rect class="box" x="20" y="390" width="260" height="112" rx="12"/><text class="title" x="38" y="424">128MB SPI-NAND</text><text class="body" x="38" y="454">U3 · W25N01GV 类</text><text class="small" x="38" y="482">原理图含 GD 替代料</text>
<rect class="box" x="20" y="530" width="260" height="112" rx="12"/><text class="title" x="38" y="564">USB-A Host · USB1</text><text class="body" x="38" y="594">USB 2.0 / 480Mbps</text><text class="small" x="38" y="622">5V VBUS 经限流开关</text>
<rect class="box" x="20" y="670" width="260" height="112" rx="12"/><text class="title" x="38" y="704">EEPROM · U23</text><text class="body" x="38" y="734">24C02 / 256 bytes</text><text class="small" x="38" y="762">I²C 地址 0x50 · WP 控制</text>
</g>
<g text-anchor="middle">
<path class="link" d="M284 166H456"/><text class="body" x="370" y="148">DDR4 总线</text>
<path class="link" d="M284 306H456"/><text class="body" x="370" y="286">eMMC 5.1 · 8-bit</text><text class="small" x="370" y="332">HS200 / HS400*</text>
<path class="link" d="M284 446H456"/><text class="body" x="370" y="426">Quad SPI</text><text class="small" x="370" y="472">20MHz 配置*</text>
<path class="link" d="M284 586H456"/><text class="body" x="370" y="566">USB2 D+ / D−</text><text class="small" x="370" y="612">U2_0</text>
<path class="link" d="M284 726H456"/><text class="body" x="370" y="706">I²C0</text><text class="small" x="370" y="752">SCL / SDA</text>
</g>

<g>
<rect class="box network" x="920" y="110" width="260" height="112" rx="12"/><text class="title" x="938" y="144">MT7976C → 天线</text><text class="body" x="938" y="174">Wi-Fi 6 · 2.4G 2×2</text><text class="body" x="938" y="202">5G 3×3 · RF 同轴座</text>
<rect class="box network" x="920" y="250" width="260" height="112" rx="12"/><text class="title" x="938" y="284">EN8811H → RJ45</text><text class="body" x="938" y="314">PHY #0 · MDIO 14*</text><text class="small" x="938" y="342">100 / 1000 / 2500BASE-T</text>
<rect class="box network" x="920" y="390" width="260" height="112" rx="12"/><text class="title" x="938" y="424">EN8811H → RJ45</text><text class="body" x="938" y="454">PHY #1 · MDIO 15*</text><text class="small" x="938" y="482">100 / 1000 / 2500BASE-T</text>
<rect class="box optional" x="920" y="530" width="260" height="112" rx="12"/><text class="title" style="font-size:21px" x="938" y="564">Key-M → NVMe SSD</text><text class="body" x="938" y="594">CN10 · 2230 · 3.3V</text><text class="small" x="938" y="622">插座板载，SSD 选装</text>
<rect class="box optional" x="920" y="670" width="260" height="112" rx="12"/><text class="title" x="938" y="704">Key-B → 4G/5G</text><text class="body" x="938" y="734">CN4 · 模块选装 · 3.3V</text><text class="small" x="938" y="762">模块 UIM1 ↔ CN5 Nano SIM</text>
</g>
<g text-anchor="middle">
<path class="link" d="M744 166H916"/><text class="body" x="830" y="141">AFE I/Q + 控制</text><text class="small" x="830" y="194">WF / HB / TOP</text>
<path class="link" d="M744 306H916"/><text class="body" x="830" y="280">2500BASE-X</text><text class="small" x="830" y="332">GMAC0 + MDIO</text>
<path class="link" d="M744 446H916"/><text class="body" x="830" y="420">2500BASE-X</text><text class="small" x="830" y="472">GMAC1 + MDIO</text>
<path class="link" d="M744 586H916"/><text class="body" x="830" y="560">PCIe 2.0 ×2</text><text class="small" x="830" y="612">≈1GB/s/方向**</text>
<path class="link" d="M744 726H916"/><text class="body" x="830" y="700">USB3 + USB2</text><text class="small" x="830" y="752">5Gbps / U2_1</text>
</g>

<path class="ctl" d="M510 790V834H195V875"/>
<path class="ctl" d="M600 790V875"/>
<path class="power" d="M1005 875V834H690V793"/>
<text class="small" x="215" y="825">UART0 共享网络</text><text class="small" x="610" y="846">PWM / GPIO</text><text class="small" x="826" y="825">电源分支详见图 2</text>
<rect class="box" x="20" y="875" width="350" height="115" rx="12"/>
<text class="title" x="38" y="911">调试 · UART0 / 3.3V TTL</text><text class="body" x="38" y="942">↔ CON1 三针 TX / RX / GND</text><text class="body" x="38" y="971">↔ CH340E ↔ USB-C D+/D−</text>
<rect class="box" x="425" y="875" width="350" height="115" rx="12"/>
<text class="title" x="443" y="911">风扇 · 按键 · 状态</text><text class="body" x="443" y="942">CN16 5V / GND / PWM</text><text class="body" x="443" y="971">Reset / Boot / 功能指示灯</text>
<rect x="830" y="875" width="350" height="115" rx="12" fill="#fff7ed" stroke="#cfaa7b" stroke-width="1.7"/>
<text class="title" x="848" y="911">USB-C PD 12V 输入</text><text class="body" x="848" y="942">CH224K 协商 · Buck / LDO</text><text class="body" x="848" y="971">SoC / PHY / M.2 / USB / 风扇</text>
<text class="small" x="20" y="1018">* OpenWrt 上游配置；实际固件可能不同。　** 理论编码后带宽，未扣事务协议开销。　所有外围均为功能级表达。</text>
</svg>
