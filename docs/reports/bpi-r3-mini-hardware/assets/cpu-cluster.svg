<svg xmlns="http://www.w3.org/2000/svg" id="cpu-cluster" width="1180" height="1050" viewBox="0 0 1180 1050" role="img" aria-labelledby="cpu-cluster-title cpu-cluster-desc"><title id="cpu-cluster-title">CPU 架构 · 单核执行逻辑、四核缓存与系统接口</title><desc id="cpu-cluster-desc">A53 IP 固有结构与 MT7986 实际配置分开标注；箭头为功能访问关系，不是逐周期流水线。</desc><defs><marker id="cpu-cluster-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#21789f"/></marker><marker id="cpu-cluster-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#237e70"/></marker><marker id="cpu-cluster-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#aa6729"/></marker><marker id="cpu-cluster-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#748696"/></marker><marker id="cpu-cluster-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7760a5"/></marker></defs><style>#cpu-cluster text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}#cpu-cluster path{stroke-linejoin:round}</style><rect width="1180" height="1050" fill="white"/><text x="18" y="34" font-size="28" fill="#183c51" font-weight="700" text-anchor="start">CPU 架构 · 单核执行逻辑、四核缓存与系统接口</text><text x="18" y="67" font-size="18" fill="#547084" font-weight="400" text-anchor="start">A53 IP 固有结构与 MT7986 实际配置分开标注；箭头为功能访问关系，不是逐周期流水线。</text><path d="M292 210H335" fill="none" stroke="#21789f" stroke-width="2.6"   marker-end="url(#cpu-cluster-blue)"/><path d="M555 210H600" fill="none" stroke="#21789f" stroke-width="2.6"   marker-end="url(#cpu-cluster-blue)"/><path d="M840 210H884" fill="none" stroke="#21789f" stroke-width="2.6"   marker-end="url(#cpu-cluster-blue)"/><path d="M165 265V302" fill="none" stroke="#7760a5" stroke-width="2.6"  marker-start="url(#cpu-cluster-purple)" marker-end="url(#cpu-cluster-purple)"/><path d="M1010 265V302" fill="none" stroke="#7760a5" stroke-width="2.6"  marker-start="url(#cpu-cluster-purple)" marker-end="url(#cpu-cluster-purple)"/><path d="M162 602V625" fill="none" stroke="#7760a5" stroke-width="2.6"/><path d="M447 602V625" fill="none" stroke="#7760a5" stroke-width="2.6"/><path d="M732 602V625" fill="none" stroke="#7760a5" stroke-width="2.6"/><path d="M1017 602V625" fill="none" stroke="#7760a5" stroke-width="2.6"/><path d="M162 625H1017" fill="none" stroke="#7760a5" stroke-width="2.6"/><path d="M380 625V650" fill="none" stroke="#7760a5" stroke-width="2.6"  marker-start="url(#cpu-cluster-purple)" marker-end="url(#cpu-cluster-purple)"/><path d="M380 760V845" fill="none" stroke="#7760a5" stroke-width="2.6"  marker-start="url(#cpu-cluster-purple)" marker-end="url(#cpu-cluster-purple)"/><path d="M765 900H720" fill="none" stroke="#7760a5" stroke-width="2.6"  marker-start="url(#cpu-cluster-purple)" marker-end="url(#cpu-cluster-purple)"/><path d="M953 845V760" fill="none" stroke="#748696" stroke-width="2.6" stroke-dasharray="7 5"  marker-end="url(#cpu-cluster-gray)"/><rect x="15" y="95" width="1150" height="304" rx="16" fill="#21789f05" stroke="#21789f" stroke-width="2" stroke-dasharray="9 5"/><rect x="27" y="102" width="734.5200000000008" height="29" rx="4" fill="white"/><text x="33" y="124" font-size="23" fill="#21789f" font-weight="700" text-anchor="start">单个 Cortex-A53 核心 · ARMv8-A / AArch64 + AArch32</text><g data-box="取指 / 分支预测"><rect x="40" y="152" width="252" height="113" rx="12" fill="#21789f0b" stroke="#21789f" stroke-width="1.8"/><text x="55" y="183" font-size="22" fill="#21789f" font-weight="700" text-anchor="start">取指 / 分支预测</text><text x="55" y="213" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">L1 I-cache + 指令 µTLB</text><text x="55" y="240" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">顺序执行 / 双发射</text></g><g data-box="译码 / 发射"><rect x="335" y="152" width="220" height="113" rx="12" fill="#21789f0b" stroke="#21789f" stroke-width="1.8"/><text x="350" y="183" font-size="22" fill="#21789f" font-weight="700" text-anchor="start">译码 / 发射</text><text x="350" y="213" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">双指令译码</text><text x="350" y="240" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">8 级基本流水线</text></g><g data-box="执行资源"><rect x="600" y="152" width="240" height="113" rx="12" fill="#21789f0b" stroke="#21789f" stroke-width="1.8"/><text x="615" y="183" font-size="22" fill="#21789f" font-weight="700" text-anchor="start">执行资源</text><text x="615" y="213" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">整数 / 分支 / Load-Store</text><text x="615" y="240" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">NEON / FP / Crypto</text></g><g data-box="数据 / 地址翻译"><rect x="884" y="152" width="255" height="113" rx="12" fill="#21789f0b" stroke="#21789f" stroke-width="1.8"/><text x="899" y="183" font-size="22" fill="#21789f" font-weight="700" text-anchor="start">数据 / 地址翻译</text><text x="899" y="213" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">L1 D-cache / Store buffer</text><text x="899" y="240" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">MMU / 主 TLB / 预取</text></g><g data-box="每核 L1I：32KiB / 2-way / 64B line"><rect x="40" y="302" width="515" height="71" rx="12" fill="#7760a50b" stroke="#7760a5" stroke-width="1.8"/><text x="55" y="333" font-size="22" fill="#7760a5" font-weight="700" text-anchor="start">每核 L1I：32KiB / 2-way / 64B line</text></g><g data-box="每核 L1D：32KiB / 4-way / 64B line"><rect x="600" y="302" width="539" height="71" rx="12" fill="#7760a50b" stroke="#7760a5" stroke-width="1.8"/><text x="615" y="333" font-size="22" fill="#7760a5" font-weight="700" text-anchor="start">每核 L1D：32KiB / 4-way / 64B line</text></g><rect x="15" y="433" width="1150" height="360" rx="16" fill="#21789f05" stroke="#21789f" stroke-width="2" stroke-dasharray="9 5"/><rect x="27" y="440" width="412.52000000000004" height="29" rx="4" fill="white"/><text x="33" y="462" font-size="23" fill="#21789f" font-weight="700" text-anchor="start">MT7986A MCUSYS · 单个四核集群</text><g data-box="CPU0 · Cortex-A53"><rect x="40" y="487" width="245" height="115" rx="12" fill="#21789f0b" stroke="#21789f" stroke-width="1.8"/><text x="55" y="518" font-size="22" fill="#21789f" font-weight="700" text-anchor="start">CPU0 · Cortex-A53</text><text x="55" y="548" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">L1I 32KiB + L1D 32KiB</text><text x="55" y="575" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">MMU / TLB / PMU</text></g><g data-box="CPU1 · Cortex-A53"><rect x="325" y="487" width="245" height="115" rx="12" fill="#21789f0b" stroke="#21789f" stroke-width="1.8"/><text x="340" y="518" font-size="22" fill="#21789f" font-weight="700" text-anchor="start">CPU1 · Cortex-A53</text><text x="340" y="548" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">L1I 32KiB + L1D 32KiB</text><text x="340" y="575" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">MMU / TLB / PMU</text></g><g data-box="CPU2 · Cortex-A53"><rect x="610" y="487" width="245" height="115" rx="12" fill="#21789f0b" stroke="#21789f" stroke-width="1.8"/><text x="625" y="518" font-size="22" fill="#21789f" font-weight="700" text-anchor="start">CPU2 · Cortex-A53</text><text x="625" y="548" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">L1I 32KiB + L1D 32KiB</text><text x="625" y="575" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">MMU / TLB / PMU</text></g><g data-box="CPU3 · Cortex-A53"><rect x="895" y="487" width="245" height="115" rx="12" fill="#21789f0b" stroke="#21789f" stroke-width="1.8"/><text x="910" y="518" font-size="22" fill="#21789f" font-weight="700" text-anchor="start">CPU3 · Cortex-A53</text><text x="910" y="548" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">L1I 32KiB + L1D 32KiB</text><text x="910" y="575" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">MMU / TLB / PMU</text></g><g data-box="SCU + 共享统一 L2：512KiB"><rect x="40" y="650" width="680" height="110" rx="12" fill="#7760a50b" stroke="#7760a5" stroke-width="1.8"/><text x="55" y="681" font-size="22" fill="#7760a5" font-weight="700" text-anchor="start">SCU + 共享统一 L2：512KiB</text><text x="55" y="711" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">16-way / 64B line；SCU 保持核心间数据缓存一致性</text><text x="55" y="738" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">L2 未命中、非缓存事务 → 集群外部 master 接口</text></g><g data-box="GICv3 / Timer / Debug"><rect x="765" y="650" width="375" height="110" rx="12" fill="#7486960b" stroke="#748696" stroke-width="1.8"/><text x="780" y="681" font-size="22" fill="#748696" font-weight="700" text-anchor="start">GICv3 / Timer / Debug</text><text x="780" y="711" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">外设中断送往 A53；PMU 性能计数</text><text x="780" y="738" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">PSCI / SMC 管理 CPU 启停</text></g><text x="410" y="822" font-size="18" fill="#7760a5" font-weight="400" text-anchor="start">A53 IP：128-bit 系统 master 接口</text><g data-box="SoC 互连 → EMI / DRAMC → 板载 DDR4"><rect x="40" y="845" width="680" height="110" rx="12" fill="#7760a50b" stroke="#7760a5" stroke-width="1.8"/><text x="55" y="876" font-size="22" fill="#7760a5" font-weight="700" text-anchor="start">SoC 互连 → EMI / DRAMC → 板载 DDR4</text><text x="55" y="906" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">16-bit DDR4；最高 3200MT/s 为控制器平台能力</text><text x="55" y="933" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">实际内存训练频率、互连频率、仲裁效率须实机确认</text></g><g data-box="NETSYS / CONNSYS / I/O DMA"><rect x="765" y="845" width="375" height="110" rx="12" fill="#237e700b" stroke="#237e70" stroke-width="1.8"/><text x="780" y="876" font-size="22" fill="#237e70" font-weight="700" text-anchor="start">NETSYS / CONNSYS / I/O DMA</text><text x="780" y="906" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">并行访问共享 DDR；不是 A53 执行单元</text><text x="780" y="933" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">缓存同步和内存屏障由驱动处理</text></g><text x="18" y="994" font-size="18" fill="#183c51" font-weight="400" text-anchor="start">A53 IP 可选 ACE / CHI 与 ACP；MT7986 文档出现 AXI / ACP 标记，但未公开核定全部端口的实例化和连接。</text><text x="18" y="1024" font-size="18" fill="#183c51" font-weight="400" text-anchor="start">不能据此断言所有 DMA 经 ACP 直达 L2，也不能把 CPU 2GHz 当作片内总线时钟。</text></svg>