<svg xmlns="http://www.w3.org/2000/svg" id="software-datapaths" width="1180" height="1020" viewBox="0 0 1180 1020" role="img" aria-labelledby="software-datapaths-title software-datapaths-desc"><title id="software-datapaths-title">技术栈与转发路径 · 控制面始终由软件参与</title><desc id="software-datapaths-desc">两套驱动路线用于解释同一硬件；当前构建选择厂商栈，不表示上游驱动同时接管该无线设备。</desc><defs><marker id="software-datapaths-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#21789f"/></marker><marker id="software-datapaths-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#237e70"/></marker><marker id="software-datapaths-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#aa6729"/></marker><marker id="software-datapaths-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#748696"/></marker><marker id="software-datapaths-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7760a5"/></marker></defs><style>#software-datapaths text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}#software-datapaths path{stroke-linejoin:round}</style><rect width="1180" height="1020" fill="white"/><text x="18" y="34" font-size="28" fill="#183c51" font-weight="700" text-anchor="start">技术栈与转发路径 · 控制面始终由软件参与</text><text x="18" y="67" font-size="18" fill="#547084" font-weight="400" text-anchor="start">两套驱动路线用于解释同一硬件；当前构建选择厂商栈，不表示上游驱动同时接管该无线设备。</text><path d="M295 199V248" fill="none" stroke="#748696" stroke-width="2.6" stroke-dasharray="7 5"  marker-end="url(#software-datapaths-gray)"/><path d="M885 199V248" fill="none" stroke="#748696" stroke-width="2.6" stroke-dasharray="7 5"  marker-end="url(#software-datapaths-gray)"/><path d="M295 430V490" fill="none" stroke="#748696" stroke-width="2.6" stroke-dasharray="7 5" marker-start="url(#software-datapaths-gray)" marker-end="url(#software-datapaths-gray)"/><path d="M885 430V490" fill="none" stroke="#748696" stroke-width="2.6" stroke-dasharray="7 5" marker-start="url(#software-datapaths-gray)" marker-end="url(#software-datapaths-gray)"/><path d="M310 750H380" fill="none" stroke="#21789f" stroke-width="2.6"  marker-start="url(#software-datapaths-blue)" marker-end="url(#software-datapaths-blue)"/><path d="M310 887H380" fill="none" stroke="#237e70" stroke-width="2.6"  marker-start="url(#software-datapaths-green)" marker-end="url(#software-datapaths-green)"/><path d="M740 750H810" fill="none" stroke="#21789f" stroke-width="2.6"  marker-start="url(#software-datapaths-blue)" marker-end="url(#software-datapaths-blue)"/><path d="M740 887H810" fill="none" stroke="#237e70" stroke-width="2.6"  marker-start="url(#software-datapaths-green)" marker-end="url(#software-datapaths-green)"/><g data-box="应用 / 配置层"><rect x="25" y="100" width="1130" height="99" rx="12" fill="#21789f0b" stroke="#21789f" stroke-width="1.8"/><text x="40" y="131" font-size="22" fill="#21789f" font-weight="700" text-anchor="start">应用 / 配置层</text><text x="40" y="161" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">LuCI / UCI / netifd / 路由与防火墙配置；用户业务：上网、存储、蜂窝网络、VPN 等。</text></g><g data-box="当前工程：厂商技术栈"><rect x="25" y="248" width="540" height="182" rx="12" fill="#237e700b" stroke="#237e70" stroke-width="1.8"/><text x="40" y="279" font-size="22" fill="#237e70" font-weight="700" text-anchor="start">当前工程：厂商技术栈</text><text x="40" y="309" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">Linux 6.6 / mtk_eth_soc</text><text x="40" y="336" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">mt_wifi + mtwifi-cfg / Wi-Fi 固件</text><text x="40" y="363" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">mtk_hnat → PPE / FOE</text><text x="40" y="390" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">warp → WED / WDMA / WO 固件</text></g><g data-box="上游 OpenWrt 常见路线（对照）"><rect x="615" y="248" width="540" height="182" rx="12" fill="#21789f0b" stroke="#21789f" stroke-width="1.8"/><text x="630" y="279" font-size="22" fill="#21789f" font-weight="700" text-anchor="start">上游 OpenWrt 常见路线（对照）</text><text x="630" y="309" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">Linux / mac80211 / cfg80211</text><text x="630" y="336" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">mt76 / mt7915 → Wi-Fi MAC / MCU</text><text x="630" y="363" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">nft flowtable → mtk_ppe → PPE</text><text x="630" y="390" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">mtk_wed / mtk_wed_wo → WED / WO</text></g><g data-box="共享硬件：NETSYS v2 + CONNSYS + DDR4"><rect x="25" y="490" width="1130" height="105" rx="12" fill="#237e700b" stroke="#237e70" stroke-width="1.8"/><text x="40" y="521" font-size="22" fill="#237e70" font-weight="700" text-anchor="start">共享硬件：NETSYS v2 + CONNSYS + DDR4</text><text x="40" y="551" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">CPU 通过 MMIO、DMA 描述符和固件消息配置；IRQ / completion / event 返回软件。</text><text x="40" y="578" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">PPE 只处理能表达并已绑定的流，未命中、异常和不支持业务仍交给 CPU。</text></g><rect x="15" y="647" width="1150" height="314" rx="16" fill="#21789f05" stroke="#21789f" stroke-width="2" stroke-dasharray="9 5"/><rect x="27" y="654" width="384" height="29" rx="4" fill="white"/><text x="33" y="676" font-size="23" fill="#21789f" font-weight="700" text-anchor="start">业务数据路径（简化双向功能表达）</text><g data-box="入口 / 出口外设"><rect x="40" y="704" width="270" height="208" rx="12" fill="#21789f0b" stroke="#21789f" stroke-width="1.8"/><text x="55" y="735" font-size="22" fill="#21789f" font-weight="700" text-anchor="start">入口 / 出口外设</text><text x="55" y="765" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">有线：PHY ↔ GMAC</text><text x="55" y="792" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">无线：RF ↔ MAC</text><text x="55" y="819" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">快路径仅用于合格网络流</text><text x="55" y="846" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">USB 接入需软件协作</text><text x="55" y="873" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">存储另走块 I/O 路径</text></g><g data-box="普通软件 / 慢路径"><rect x="380" y="704" width="360" height="92" rx="12" fill="#21789f0b" stroke="#21789f" stroke-width="1.8"/><text x="395" y="735" font-size="22" fill="#21789f" font-weight="700" text-anchor="start">普通软件 / 慢路径</text><text x="395" y="765" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">DMA ↔ DDR ↔ A53 网络栈</text></g><g data-box="硬件流卸载 / 快路径"><rect x="380" y="841" width="360" height="92" rx="12" fill="#237e700b" stroke="#237e70" stroke-width="1.8"/><text x="395" y="872" font-size="22" fill="#237e70" font-weight="700" text-anchor="start">硬件流卸载 / 快路径</text><text x="395" y="902" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">PSE ↔ PPE；无线再经 WED</text></g><g data-box="出口、限速和回退"><rect x="810" y="704" width="330" height="229" rx="12" fill="#aa67290b" stroke="#aa6729" stroke-width="1.8"/><text x="825" y="735" font-size="22" fill="#aa6729" font-weight="700" text-anchor="start">出口、限速和回退</text><text x="825" y="765" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">命中流：硬件改写 / 转发</text><text x="825" y="792" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">首包 / miss / exception：CPU</text><text x="825" y="819" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">Wi-Fi：WFDMA / MAC / RF</text><text x="825" y="846" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">Ethernet：GMAC / PHY</text><text x="825" y="873" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">卸载不等于绕过全部内存</text><text x="825" y="900" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">硬件路径可能绕过 SQM</text></g><text x="18" y="997" font-size="18" fill="#183c51" font-weight="400" text-anchor="start">EIP97 独立加密加速器和 A53 Crypto 指令是另外两条加速路线；它们不会因启用 NAT/WED 而自动接管 VPN。</text></svg>