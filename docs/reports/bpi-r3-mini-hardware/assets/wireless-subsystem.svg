<svg xmlns="http://www.w3.org/2000/svg" id="wireless-subsystem" width="1180" height="1080" viewBox="0 0 1180 1080" role="img" aria-labelledby="wireless-subsystem-title wireless-subsystem-desc"><title id="wireless-subsystem-title">无线架构 · WFDMA、MAC / 基带、RF 与 WED / WO</title><desc id="wireless-subsystem-desc">蓝色 / 绿色＝数据与功能通路，灰虚线＝固件控制；Wi-Fi PSE 与 NETSYS PSE 是两个不同模块。</desc><defs><marker id="wireless-subsystem-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#21789f"/></marker><marker id="wireless-subsystem-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#237e70"/></marker><marker id="wireless-subsystem-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#aa6729"/></marker><marker id="wireless-subsystem-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#748696"/></marker><marker id="wireless-subsystem-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7760a5"/></marker></defs><style>#wireless-subsystem text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}#wireless-subsystem path{stroke-linejoin:round}</style><rect width="1180" height="1080" fill="white"/><text x="18" y="34" font-size="28" fill="#183c51" font-weight="700" text-anchor="start">无线架构 · WFDMA、MAC / 基带、RF 与 WED / WO</text><text x="18" y="67" font-size="18" fill="#547084" font-weight="400" text-anchor="start">蓝色 / 绿色＝数据与功能通路，灰虚线＝固件控制；Wi-Fi PSE 与 NETSYS PSE 是两个不同模块。</text><path d="M195 241V360" fill="none" stroke="#748696" stroke-width="2.6" stroke-dasharray="7 5" marker-start="url(#wireless-subsystem-gray)" marker-end="url(#wireless-subsystem-gray)"/><path d="M589 241V360" fill="none" stroke="#237e70" stroke-width="2.6"  marker-start="url(#wireless-subsystem-green)" marker-end="url(#wireless-subsystem-green)"/><path d="M984 241V274H721V360" fill="none" stroke="#7760a5" stroke-width="2.6"  marker-start="url(#wireless-subsystem-purple)" marker-end="url(#wireless-subsystem-purple)"/><path d="M380 433H425" fill="none" stroke="#748696" stroke-width="2.6" stroke-dasharray="7 5" marker-start="url(#wireless-subsystem-gray)" marker-end="url(#wireless-subsystem-gray)"/><path d="M765 433H810" fill="none" stroke="#237e70" stroke-width="2.6"  marker-start="url(#wireless-subsystem-green)" marker-end="url(#wireless-subsystem-green)"/><path d="M975 498V539H647V577" fill="none" stroke="#237e70" stroke-width="2.6"  marker-start="url(#wireless-subsystem-green)" marker-end="url(#wireless-subsystem-green)"/><path d="M210 498V577" fill="none" stroke="#748696" stroke-width="2.6" stroke-dasharray="7 5" marker-start="url(#wireless-subsystem-gray)" marker-end="url(#wireless-subsystem-gray)"/><path d="M765 655H810" fill="none" stroke="#237e70" stroke-width="2.6"  marker-start="url(#wireless-subsystem-green)" marker-end="url(#wireless-subsystem-green)"/><path d="M975 734V818H340V855" fill="none" stroke="#237e70" stroke-width="2.6"  marker-start="url(#wireless-subsystem-green)" marker-end="url(#wireless-subsystem-green)"/><path d="M640 927H710" fill="none" stroke="#237e70" stroke-width="2.6"  marker-start="url(#wireless-subsystem-green)" marker-end="url(#wireless-subsystem-green)"/><g data-box="A53 / Linux 无线驱动"><rect x="25" y="102" width="340" height="139" rx="12" fill="#21789f0b" stroke="#21789f" stroke-width="1.8"/><text x="40" y="133" font-size="22" fill="#21789f" font-weight="700" text-anchor="start">A53 / Linux 无线驱动</text><text x="40" y="163" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">当前工程：mt_wifi + warp</text><text x="40" y="190" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">上游路线：mt76 / mt7915 + WED</text><text x="40" y="217" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">命令 / 事件 / 状态 / 普通报文</text></g><g data-box="NETSYS：PSE ↔ WDMA"><rect x="418" y="102" width="342" height="139" rx="12" fill="#237e700b" stroke="#237e70" stroke-width="1.8"/><text x="433" y="133" font-size="22" fill="#237e70" font-weight="700" text-anchor="start">NETSYS：PSE ↔ WDMA</text><text x="433" y="163" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">PPE 决定流改写 / 出口</text><text x="433" y="190" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">WED v2：缓冲 / 描述符衔接</text><text x="433" y="217" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">WO0/1：卸载固件与 RRO</text></g><g data-box="共享 DDR4"><rect x="813" y="102" width="342" height="139" rx="12" fill="#7760a50b" stroke="#7760a5" stroke-width="1.8"/><text x="828" y="133" font-size="22" fill="#7760a5" font-weight="700" text-anchor="start">共享 DDR4</text><text x="828" y="163" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">Host packet / descriptor rings</text><text x="828" y="190" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">WM / WO 固件保留区</text><text x="828" y="217" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">缓存同步：驱动 DMA API</text></g><rect x="15" y="302" width="1150" height="492" rx="16" fill="#237e7005" stroke="#237e70" stroke-width="2" stroke-dasharray="9 5"/><rect x="27" y="309" width="582.7200000000003" height="29" rx="4" fill="white"/><text x="33" y="331" font-size="23" fill="#237e70" font-weight="700" text-anchor="start">MT7986A · CONNSYS / 集成 Wi-Fi 数字子系统</text><g data-box="Wi-Fi WM / WA 固件域"><rect x="40" y="360" width="340" height="138" rx="12" fill="#aa67290b" stroke="#aa6729" stroke-width="1.8"/><text x="55" y="391" font-size="22" fill="#aa6729" font-weight="700" text-anchor="start">Wi-Fi WM / WA 固件域</text><text x="55" y="421" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">WM 管理 / WA 协作固件</text><text x="55" y="448" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">资料：Andes 处理器带 I/D cache</text><text x="55" y="475" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">具体型号 / cache 容量未公开</text></g><g data-box="WFDMA / Host DMA"><rect x="425" y="360" width="340" height="138" rx="12" fill="#21789f0b" stroke="#21789f" stroke-width="1.8"/><text x="440" y="391" font-size="22" fill="#21789f" font-weight="700" text-anchor="start">WFDMA / Host DMA</text><text x="440" y="421" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">主机 TX / RX 描述符环</text><text x="440" y="448" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">DMA ring + token / completion</text><text x="440" y="475" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">连接 AP、DDR、WED</text></g><g data-box="UMAC：Wi-Fi PSE / PLE"><rect x="810" y="360" width="330" height="138" rx="12" fill="#237e700b" stroke="#237e70" stroke-width="1.8"/><text x="825" y="391" font-size="22" fill="#237e70" font-weight="700" text-anchor="start">UMAC：Wi-Fi PSE / PLE</text><text x="825" y="421" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">PSE：包页 / 缓冲 / 端口</text><text x="825" y="448" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">PLE：队列 / 链表调度</text><text x="825" y="475" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">DMASHDL / WTBL 状态</text></g><g data-box="双频 MAC / LMAC + Baseband / PHY 数字处理"><rect x="40" y="577" width="725" height="157" rx="12" fill="#237e700b" stroke="#237e70" stroke-width="1.8"/><text x="55" y="608" font-size="22" fill="#237e70" font-weight="700" text-anchor="start">双频 MAC / LMAC + Baseband / PHY 数字处理</text><text x="55" y="638" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">802.11ax MAC：聚合 / Block ACK / 队列 / 重传 / 硬件安全处理</text><text x="55" y="665" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">基带：OFDM/OFDMA、MIMO、调制编码、波束成形相关处理</text><text x="55" y="692" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">2.4GHz 与 5GHz 逻辑无线链；调度、速率控制依固件配置</text><text x="55" y="719" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">这里的 PHY 是无线数字基带，不是 EN8811H 以太网 PHY。</text></g><g data-box="RF 接口与时序 / 校准"><rect x="810" y="577" width="330" height="157" rx="12" fill="#237e700b" stroke="#237e70" stroke-width="1.8"/><text x="825" y="608" font-size="22" fill="#237e70" font-weight="700" text-anchor="start">RF 接口与时序 / 校准</text><text x="825" y="638" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">AFE I/Q 模拟信号</text><text x="825" y="665" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">WF / HB / TOP 控制信号</text><text x="825" y="692" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">射频校准 / 芯片协作</text><text x="825" y="719" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">不是 PCIe 或 USB Wi-Fi 卡</text></g><g data-box="外部 MT7976C · 射频 / 模拟收发"><rect x="40" y="855" width="600" height="144" rx="12" fill="#237e700b" stroke="#237e70" stroke-width="1.8"/><text x="55" y="886" font-size="22" fill="#237e70" font-weight="700" text-anchor="start">外部 MT7976C · 射频 / 模拟收发</text><text x="55" y="916" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">基带 I/Q ↔ 射频收发 / 频率转换等模拟处理</text><text x="55" y="943" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">板级：2.4GHz 2×2 + 5GHz 3×3</text><text x="55" y="970" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">完整 RF 原理图未公开：不细画未经确认的 PA/LNA/FEM 分配</text></g><g data-box="天线 / 无线空口"><rect x="710" y="855" width="430" height="144" rx="12" fill="#237e700b" stroke="#237e70" stroke-width="1.8"/><text x="725" y="886" font-size="22" fill="#237e70" font-weight="700" text-anchor="start">天线 / 无线空口</text><text x="725" y="916" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">2GA / 2GB；5GA / 5GB / 5GC</text><text x="725" y="943" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">802.11 a/b/g/n/ac/ax 按频段使用</text><text x="725" y="970" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">空口 PHY 速率取决于 NSS / BW / MCS / GI</text></g><text x="18" y="1040" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">WFDMA ≠ WDMA；WM/WA ≠ WO；Wi-Fi PSE/PLE 的 page buffer ≠ A53 L1/L2 ≠ PPE FOE cache。</text></svg>