<svg xmlns="http://www.w3.org/2000/svg" id="netsys-acceleration" width="1180" height="1050" viewBox="0 0 1180 1050" role="img" aria-labelledby="netsys-acceleration-title netsys-acceleration-desc"><title id="netsys-acceleration-title">NETSYS v2 · PSE 交换、PPE 流处理与 DMA</title><desc id="netsys-acceleration-desc">PSE 是内部包交换节点；PPE 是流查找 / 改写引擎；两者都不属于 A53 的指令执行或 CPU cache。</desc><defs><marker id="netsys-acceleration-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#21789f"/></marker><marker id="netsys-acceleration-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#237e70"/></marker><marker id="netsys-acceleration-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#aa6729"/></marker><marker id="netsys-acceleration-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#748696"/></marker><marker id="netsys-acceleration-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7760a5"/></marker></defs><style>#netsys-acceleration text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}#netsys-acceleration path{stroke-linejoin:round}</style><rect width="1180" height="1050" fill="white"/><text x="18" y="34" font-size="28" fill="#183c51" font-weight="700" text-anchor="start">NETSYS v2 · PSE 交换、PPE 流处理与 DMA</text><text x="18" y="67" font-size="18" fill="#547084" font-weight="400" text-anchor="start">PSE 是内部包交换节点；PPE 是流查找 / 改写引擎；两者都不属于 A53 的指令执行或 CPU cache。</text><path d="M197 280V374" fill="none" stroke="#237e70" stroke-width="2.6"  marker-start="url(#netsys-acceleration-green)" marker-end="url(#netsys-acceleration-green)"/><path d="M589 280V374" fill="none" stroke="#237e70" stroke-width="2.6"  marker-start="url(#netsys-acceleration-green)" marker-end="url(#netsys-acceleration-green)"/><path d="M981 280V374" fill="none" stroke="#237e70" stroke-width="2.6"  marker-start="url(#netsys-acceleration-green)" marker-end="url(#netsys-acceleration-green)"/><path d="M245 494V568" fill="none" stroke="#237e70" stroke-width="2.6"  marker-start="url(#netsys-acceleration-green)" marker-end="url(#netsys-acceleration-green)"/><path d="M450 649H510" fill="none" stroke="#aa6729" stroke-width="2.6"  marker-start="url(#netsys-acceleration-orange)" marker-end="url(#netsys-acceleration-orange)"/><path d="M795 699H855" fill="none" stroke="#748696" stroke-width="2.6" stroke-dasharray="7 5" marker-start="url(#netsys-acceleration-gray)" marker-end="url(#netsys-acceleration-gray)"/><path d="M1013 494V568" fill="none" stroke="#748696" stroke-width="2.6" stroke-dasharray="7 5" marker-start="url(#netsys-acceleration-gray)" marker-end="url(#netsys-acceleration-gray)"/><path d="M997 745V850" fill="none" stroke="#748696" stroke-width="2.6" stroke-dasharray="7 5" marker-start="url(#netsys-acceleration-gray)" marker-end="url(#netsys-acceleration-gray)"/><path d="M855 922H795" fill="none" stroke="#7760a5" stroke-width="2.6"  marker-start="url(#netsys-acceleration-purple)" marker-end="url(#netsys-acceleration-purple)"/><path d="M1140 234H1155V805H760V850" fill="none" stroke="#7760a5" stroke-width="2.6"  marker-start="url(#netsys-acceleration-purple)" marker-end="url(#netsys-acceleration-purple)"/><path d="M589 154V132H1173V823H615V850" fill="none" stroke="#7760a5" stroke-width="2.6"  marker-start="url(#netsys-acceleration-purple)" marker-end="url(#netsys-acceleration-purple)"/><path d="M245 745V850" fill="none" stroke="#7760a5" stroke-width="2.6"  marker-start="url(#netsys-acceleration-purple)" marker-end="url(#netsys-acceleration-purple)"/><path d="M651 745V850" fill="none" stroke="#7760a5" stroke-width="2.6"  marker-start="url(#netsys-acceleration-purple)" marker-end="url(#netsys-acceleration-purple)"/><rect x="15" y="95" width="1150" height="695" rx="16" fill="#237e7005" stroke="#237e70" stroke-width="2" stroke-dasharray="9 5"/><rect x="27" y="102" width="662.7600000000004" height="29" rx="4" fill="white"/><text x="33" y="124" font-size="23" fill="#237e70" font-weight="700" text-anchor="start">MT7986A · NETSYS / Frame Engine + 无线卸载接口</text><g data-box="GMAC0/1 + GDMA"><rect x="40" y="154" width="315" height="126" rx="12" fill="#237e700b" stroke="#237e70" stroke-width="1.8"/><text x="55" y="185" font-size="22" fill="#237e70" font-weight="700" text-anchor="start">GMAC0/1 + GDMA</text><text x="55" y="215" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">两路 MAC 数据端口</text><text x="55" y="242" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">↔ EN8811H ×2 ↔ RJ45 ×2</text><text x="55" y="269" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">每口 100 / 1000 / 2500Mb/s</text></g><g data-box="PPE0 / PPE1 · 两个实例"><rect x="424" y="154" width="330" height="126" rx="12" fill="#237e700b" stroke="#237e70" stroke-width="1.8"/><text x="439" y="185" font-size="22" fill="#237e70" font-weight="700" text-anchor="start">PPE0 / PPE1 · 两个实例</text><text x="439" y="215" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">解析 / 哈希 / FOE 查找 / 改写</text><text x="439" y="242" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">流缓存：驱动定义 128 项</text><text x="439" y="269" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">另有 MIB counter cache</text></g><g data-box="PDMA / QDMA"><rect x="823" y="154" width="317" height="126" rx="12" fill="#21789f0b" stroke="#21789f" stroke-width="1.8"/><text x="838" y="185" font-size="22" fill="#21789f" font-weight="700" text-anchor="start">PDMA / QDMA</text><text x="838" y="215" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">PDMA：包描述符 DMA</text><text x="838" y="242" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">QDMA：队列 / 调度 / DMA</text><text x="838" y="269" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">连接 CPU 的 DDR 数据路径</text></g><rect x="108.36" y="314" width="177.28" height="24" rx="4" fill="white"/><text x="197" y="332" font-size="18" fill="#237e70" font-weight="400" text-anchor="middle">PSE port 1 / 2</text><rect x="500.36" y="314" width="177.28" height="24" rx="4" fill="white"/><text x="589" y="332" font-size="18" fill="#237e70" font-weight="400" text-anchor="middle">PSE port 3 / 4</text><rect x="892.36" y="314" width="177.28" height="24" rx="4" fill="white"/><text x="981" y="332" font-size="18" fill="#237e70" font-weight="400" text-anchor="middle">PSE port 0 / 5</text><g data-box="NETSYS PSE · Packet Switch Engine"><rect x="40" y="374" width="1100" height="120" rx="12" fill="#237e700b" stroke="#237e70" stroke-width="1.8"/><text x="55" y="405" font-size="22" fill="#237e70" font-weight="700" text-anchor="start">NETSYS PSE · Packet Switch Engine</text><text x="55" y="435" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">内部包转接 / 端口队列 / 缓冲与流控；连接 GMAC、PPE、PDMA/QDMA 和 WDMA。</text><text x="55" y="462" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">片内包缓冲字节容量未公开核定；PSE 的 MMIO 地址窗口大小不等于缓冲 SRAM 容量。</text></g><rect x="156.36" y="519" width="177.28" height="24" rx="4" fill="white"/><text x="245" y="537" font-size="18" fill="#237e70" font-weight="400" text-anchor="middle">PSE port 8 / 9</text><g data-box="WDMA0 / WDMA1 → WED v2 ×2"><rect x="40" y="568" width="410" height="177" rx="12" fill="#237e700b" stroke="#237e70" stroke-width="1.8"/><text x="55" y="599" font-size="22" fill="#237e70" font-weight="700" text-anchor="start">WDMA0 / WDMA1 → WED v2 ×2</text><text x="55" y="629" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">WDMA：NETSYS 侧无线 DMA 接口</text><text x="55" y="656" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">WED：环 / token / 缓冲衔接</text><text x="55" y="683" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">↔ Wi-Fi WFDMA（CONNSYS）</text><text x="55" y="710" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">TX / RX 卸载依驱动与固件启用</text></g><g data-box="WO0 / WO1"><rect x="510" y="568" width="285" height="177" rx="12" fill="#aa67290b" stroke="#aa6729" stroke-width="1.8"/><text x="525" y="599" font-size="22" fill="#aa6729" font-weight="700" text-anchor="start">WO0 / WO1</text><text x="525" y="629" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">无线卸载控制固件</text><text x="525" y="656" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">接收卸载 / RRO 协作</text><text x="525" y="683" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">AP ↔ WO：CCIF</text><text x="525" y="710" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">不是 Wi-Fi WM / WA</text></g><g data-box="AP / CPU 接口"><rect x="855" y="568" width="285" height="177" rx="12" fill="#7486960b" stroke="#748696" stroke-width="1.8"/><text x="870" y="599" font-size="22" fill="#748696" font-weight="700" text-anchor="start">AP / CPU 接口</text><text x="870" y="629" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">PDMA/QDMA 上送异常</text><text x="870" y="656" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">MMIO 配置 / IRQ 通知</text><text x="870" y="683" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">CCIF ↔ AP 固件控制</text><text x="870" y="710" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">A53 核心不在 NETSYS 内</text></g><g data-box="板载 DDR4 · 共享内存，不是片内 cache"><rect x="40" y="850" width="755" height="140" rx="12" fill="#7760a50b" stroke="#7760a5" stroke-width="1.8"/><text x="55" y="881" font-size="22" fill="#7760a5" font-weight="700" text-anchor="start">板载 DDR4 · 共享内存，不是片内 cache</text><text x="55" y="911" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">FOE：默认 16K×96B/PPE ≈ 1.5MiB/PPE（条目区）</text><text x="55" y="938" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">另有 MIB / 描述符 / packet pool / 固件 / RRO 队列</text><text x="55" y="965" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">卸载降低 CPU 逐包负担，不代表不访问 DDR。</text></g><g data-box="A53 / Linux"><rect x="855" y="850" width="285" height="140" rx="12" fill="#21789f0b" stroke="#21789f" stroke-width="1.8"/><text x="870" y="881" font-size="22" fill="#21789f" font-weight="700" text-anchor="start">A53 / Linux</text><text x="870" y="911" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">NAPI / 网络栈 / 首包策略</text><text x="870" y="938" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">绑定 FOE / 固件管理</text><text x="870" y="965" font-size="19" fill="#183c51" font-weight="400" text-anchor="start">本体位于 MCUSYS</text></g><text x="18" y="1030" font-size="18" fill="#183c51" font-weight="400" text-anchor="start">端口编号来自本工程 NETSYS v2 HNAT 定义；不是 Linux 接口编号。图中只表达功能关系，不声称物理串接顺序。</text></svg>